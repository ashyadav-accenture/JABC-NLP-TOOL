# theme_keywords.yaml
# Positive / negative single-word-or-short keyword dictionaries per Brand Health Theme.
# Phrase-level rules (multi-word, negation, intensifiers) live in phrase_rules.yaml and
# always take precedence over these keyword matches (see scoring.py / evidence.py).

awareness:
  positive:
    - familiar
    - heard of
    - aware
    - know about
    - first heard
    - presented
    - presentation
    - outreach
    - principals
    - vice-principals
    - superintendents
    - program already happening
    - long-standing
    - recognize the name
    - well known
  negative:
    - never heard
    - not familiar
    - don't know
    - dont know
    - unsure
    - unfamiliar
    - no idea
    - never come across

